name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Flutter ${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version supported by the package, and the latest stable.
        flutter-version: ['3.47.0', 'any']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --directory example

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Show the files changed by the Flutter tool
        run: git status --short && git --no-pager diff

      - name: Check the package can be published
        run: flutter pub publish --dry-run
